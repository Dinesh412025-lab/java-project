<!DOCTYPE html>
<html>
<head>
    <title>MedGrid-AI Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .card { border: 1px solid #ccc; padding: 15px; margin-bottom: 20px; border-radius: 5px; }
    </style>
</head>
<body>
    <h1>MedGrid-AI 2.0 Dashboard</h1>
    <h2>Welcome, <span id="username">Loading...</span></h2>
    
    <div class="card">
        <h3>Dispatch Emergency</h3>
        <label>Condition: </label>
        <input type="text" id="condition" value="Cardiac Arrest"><br><br>
        <label>Latitude: </label>
        <input type="text" id="lat" value="40.7128"><br><br>
        <label>Longitude: </label>
        <input type="text" id="lon" value="-74.0060"><br><br>
        <button onclick="dispatchRequest()">Find Hospital & Ambulance</button>
    </div>

    <div class="card" id="result" style="display:none;">
        <h3>Dispatch Result</h3>
        <p><b>Status:</b> <span id="status"></span></p>
        <p><b>Matched Hospital ID:</b> <span id="hospital"></span></p>
        <p><b>Hospital Condition Fit Score:</b> <span id="fit"></span></p>
        <p><b>Dispatched Ambulance ID:</b> <span id="ambulance"></span></p>
        <p><b>Ambulance ETA:</b> <span id="eta"></span></p>
    </div>

    <script>
        fetch('/api/user').then(r => r.json()).then(data => {
            document.getElementById('username').innerText = data.name;
        });

        function dispatchRequest() {
            const req = {
                condition: document.getElementById('condition').value,
                latitude: parseFloat(document.getElementById('lat').value),
                longitude: parseFloat(document.getElementById('lon').value)
            };
            
            fetch('/api/request', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(req)
            }).then(r => r.json()).then(data => {
                document.getElementById('result').style.display = 'block';
                document.getElementById('status').innerText = data.status;
                if (data.hospitalBid) {
                    document.getElementById('hospital').innerText = data.hospitalBid.agentId;
                    document.getElementById('fit').innerText = data.hospitalBid.conditionFitScore.toFixed(2);
                }
                if (data.ambulanceBid) {
                    document.getElementById('ambulance').innerText = data.ambulanceBid.agentId;
                    document.getElementById('eta').innerText = data.ambulanceBid.estimatedEta.toFixed(2) + " mins";
                }
            });
        }
    </script>
</body>
</html>
